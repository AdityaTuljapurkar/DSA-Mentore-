services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dashboard_DSA_MENTORE
      POSTGRES_USER: aditya
      POSTGRES_PASSWORD: aditya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aditya -d dashboard_DSA_MENTORE"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend/frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./Frontend/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data: